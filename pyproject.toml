[project]
name = "blockchain-data-storage-analyst"
version = "3.2.0"
requires-python = ">=3.14.8"
dependencies = [
    "niquests>=3.20.1",
    "orjson>=3.11.9",
    "polars>=1.42.1",
    "pyarrow>=26.0.0",
]

[project.scripts]
poly-fetch = "poly_data_storage.cli:main"
poly-events = "poly_events_storage.cli:main"
poly-events-resolve = "poly_events_resolve_storage.cli:main"
chainlink-fetch = "chainlink_asset_storage.cli:main"
poly-trades-normalize = "poly_trades_normalize.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poly_data_storage", "src/poly_events_storage", "src/poly_events_resolve_storage", "src/chainlink_asset_storage", "src/poly_trades_normalize"]

[tool.uv]
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]
