[project]
name = "poly-data-storage"
version = "1.0.0"
requires-python = ">=3.14.5"
dependencies = [
    "niquests>=3.20.1",
    "orjson>=3.11.9",
    "pyarrow>=25.0.0",
]

[project.scripts]
poly-fetch = "poly_data_storage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poly_data_storage"]

[tool.uv]
python-preference = "only-managed"
