[project]
name = "poly-data-storage"
version = "2.1.0"
requires-python = ">=3.14.5"
dependencies = [
    "niquests>=3.20.1",
    "orjson>=3.11.9",
    "pyarrow>=25.0.0",
]

[project.scripts]
poly-fetch = "poly_data_storage.cli:main"
poly-events = "poly_events_storage.cli:main"
poly-events-resolve = "poly_events_resolve_storage.cli:main"
chainlink-fetch = "chainlink_asset_storage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poly_data_storage", "src/poly_events_storage", "src/poly_events_resolve_storage", "src/chainlink_asset_storage"]

[tool.uv]
python-preference = "only-managed"
